# Reglas editables de Alivio Norte. Se recargan solas al guardar el archivo:
# no hay que reiniciar nada ni tocar el código.
version: "1.1"
agencia: "Alivio Norte"
partner: "Consejería Clara"
termino_personal_partner: "Consejero"

# Candados: el sistema nunca actúa solo hacia afuera.
guardrails:
  auto_enviar: false
  auto_transferir: false
  ante_duda: "escalar_humano"

# Orden en que se decide (primera regla que aplica gana).
# Debe mantenerse igual que el docstring de app/engine/classifier.py:
#   0) solo emojis/símbolos                                   -> ignorar
#   1) riesgo crítico (peso >= umbral_critico)                -> escalar_humano
#   2) baja voluntaria, spam, mensaje vacío, fuera de alcance -> ignorar
#   3) suma de riesgos >= umbral_escalar                      -> escalar_humano
#   4) deuda no elegible o monto >= monto_alto_revision_usd   -> escalar_humano
#   5) sin señal de deuda ni de interés (ambiguo)             -> escalar_humano
#   6) monto < monto_minimo_usd                               -> accion_monto_bajo
#   7) en otro caso                                           -> responder (pre-califica + borrador)
riesgo:
  umbral_critico: 9
  umbral_escalar: 5

reglas_monto:
  monto_minimo_usd: 5000
  # Por debajo del mínimo: responder_no_califica | ignorar | escalar_humano
  # (ignorar a alguien con deuda real es mala experiencia; por eso el default cambia)
  accion_monto_bajo: "responder_no_califica"
  monto_alto_revision_usd: 75000

# Tipos de deuda. Cada término es una raíz: "medic" atrapa médica, médicos, etc.
deudas_elegibles:
  tarjeta_credito: [tarjeta, visa, mastercard, amex, chase, discover, discovery, "capital one", "tienda departamental", "credit card", "deudas de credito", "deuda de credito"]
  prestamo_personal: ["prestamo personal", prestamo]
  gastos_medicos: [medic, hospital, clinica]

deudas_no_elegibles:
  hipoteca: [hipoteca]
  prestamo_estudiantil: [estudiantil]
  prestamo_auto: ["prestamo de auto", "prestamo del auto", "prestamo del carro", "financiamiento del auto", "deuda del carro"]

# Palabras que indican que el mensaje trata de una deuda (aparte del monto y el tipo)
senales_deuda: [debo, deuda, deudas, intereses, "pagos minimos", "los minimos", "bajar la cuota"]

# Frases inocentes que contienen una raíz de riesgo. Se borran del texto ANTES de
# buscar palabras de riesgo. Ej.: "sin embargo" no debe disparar "embarg".
# Ojo: solo se borra la frase; "sin embargo me van a embargar" igual escala.
frases_neutras: ["sin embargo", "oferta y demanda", "alta demanda", "mucha demanda", "buen juicio", "a mi juicio"]

# Mensajes legítimos que aún no mencionan deuda ("hola", "info"): se responden pidiendo datos.
# Si no hay señal de deuda NI de interés, el mensaje es ambiguo y va a un humano.
senales_interes: [hola, buenas, buenos, "buen dia", info, ayud, "como funciona", "me interesa", "quiero saber", "quisiera saber", califico, aplico, consejeria]

# ---------- IGNORAR ----------
ignorar:
  mensajes_exactos: [ok, jaja, jajaja, gracias, listo]
  solo_emojis: true
  # Spam: se ignora siempre
  spam_siempre: [bitcoin, crypto, cripto, "duplica tus ingresos", seguidores, siganme, "gana dinero", "sin buro", "sin esfuerzo", "http", "www."]
  # Fuera de alcance: se ignora SOLO si no hay señal de deuda.
  # Ej.: "me quedé sin trabajo y debo $7,400" NO se ignora aunque diga "trabajo".
  fuera_de_alcance_si_sin_deuda: [vacantes, empleo, trabajo, "busco trabajo", "buscan gente", "atencion al cliente", inversion, publicidad]
  baja_voluntaria: ["darme de baja", "no me escriban", "stop"]
  baja_marca_no_contactar: true

# ---------- ESCALAR A HUMANO ----------
# peso >= umbral_critico: escala sin más. Si no, los pesos se suman contra umbral_escalar.
categorias_escalar_humano:
  riesgo_emocional:
    peso: 10
    terminos: [suicid, "quitarme la vida", desesperad, "no puedo mas", "no aguanto", "ya no quiero seguir", "sin salida"]
  legal:
    peso: 9
    terminos: [abogad, demand, juez, juicio, embarg, quiebra, bancarrota, citatorio, "orden judicial"]
  datos_sensibles:
    peso: 9
    regex: ['\b\d{3}-\d{2}-\d{4}\b']   # formato de número de seguro social
    terminos: ["seguro social", ssn, "numero de tarjeta"]
  hostigamiento_cobranza:
    peso: 7
    terminos: [acoso, acosa, acosando, amenaz, coleccionista, cobrador]
  fraude_o_desconfianza:
    peso: 7
    terminos: [fraud, estafa, robar]
  promesa_de_ahorro:
    peso: 7
    terminos: [garantiz, garantia, descuento, "cuanto me ahorr", "cuanto voy a ahorr"]
  precio_o_tarifas:
    peso: 7
    terminos: ["cuanto cobran", "cuanto cuesta", "cuanto me cobr", tarifa, honorarios, comision]
  deuda_ajena_o_disputada:
    peso: 6
    terminos: ["no es mia", "no es mi deuda"]
  deuda_de_negocio:
    peso: 5
    terminos: ["para un negocio", "de mi negocio", "mi empresa"]
  programa_previo:
    peso: 5
    terminos: ["consolidacion anterior", "programa anterior"]
  pide_humano:
    peso: 5
    terminos: ["hablar con una persona", "hablar con un humano", "agente humano"]
  vivienda_en_riesgo:      # por sí sola no escala (peso < 5); suma con otras señales
    peso: 4
    terminos: ["perder mi casa", "quitar la casa", "quiten la casa"]

# ---------- PRE-CALIFICACIÓN ----------
precalificacion:
  quiere_consejero: [consejero, asesor, "me llamen", "me pueden llamar", "agendar una llamada", "me pasa con", "hablar con un", "quisiera hablar"]
  urgencia: ["hoy mismo", urgente, "lo antes posible"]

# ---------- CUMPLIMIENTO DE LENGUAJE ----------
compliance:
  termino_prohibido: "asesor"
  termino_obligatorio: "Consejero"
  reemplazos: {asesor: "Consejero", asesores: "Consejeros"}
  garantias_prohibidas: [garantizado, garantizamos, prometemos, "te aseguro", "100% seguro", "sin riesgo", "te vamos a ahorrar", "eliminamos tu deuda"]
  vocabulario_permitido_ahorro: ["podría", "en muchos casos", "dependiendo de tu perfil", "es posible"]
  nunca_afirmar: [tasas, "puntajes de crédito", tarifas]

# ---------- DISPOSICIONES ----------
# Al aplicar una disposición: se mueve la etapa y se genera un WhatsApp (queda pendiente, no se envía solo).
# {partner} y {consejero} se completan con los valores de arriba.
disposiciones:
  "No Answer":
    etapa: sin_respuesta
    whatsapp: "Hola, intentamos comunicarnos contigo sobre tu consulta de alivio de deudas. ¿En qué horario te viene mejor que te llamemos?"
  "Info Sent":
    etapa: info_enviada
    whatsapp: "Hola, te enviamos la información sobre cómo {partner} podría ayudarte. Cuando la revises, cuéntanos si tienes dudas."
  "Transferido":
    etapa: transferido
    whatsapp: "Gracias por tu confianza. Un {consejero} de {partner} revisará tu caso y se pondrá en contacto contigo."
  "Call Back":
    etapa: callback_pendiente
    whatsapp: "Con gusto, quedamos pendientes de volver a llamarte. Si prefieres otro horario, escríbenos por aquí."
  "No le interesa":
    etapa: cerrado_no_interesado
    marcar_no_contactar: true
    whatsapp: "Entendido, gracias por tu tiempo. No te escribiremos más por este tema."
